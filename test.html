<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#000;
  --text:#f5f5f5;
  --accent:#bba0f2;
  --gold:#d4af37;
  --dark-plum:#2c1e3a;
  --transition:all .3s ease;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Bricolage Grotesque',sans-serif;
  margin:0;
}

/* container */
.container{
  max-width:1200px;
  margin:auto;
  padding:0 20px;
}

/* Contact Section */
.contact-section{
  padding:5rem 0;
}

.contact-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4rem;
}

/* Form */
.contact-form{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(187,160,242,.3);
  border-radius:12px;
  padding:40px;
  backdrop-filter:blur(8px);
  transition:var(--transition);
}

.contact-form h2{
  text-align:center;
  color:var(--gold);
  margin-bottom:2rem;
}

.form-group{
  margin-bottom:1.5rem;
}

.form-group label{
  display:block;
  margin-bottom:.5rem;
  font-size:.9rem;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  background:transparent;
  border:none;
  border-bottom:1px solid #555;
  color:var(--text);
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  outline:none;
  border-color:var(--accent);
}

.submit-btn{
  width:100%;
  padding:12px;
  background:linear-gradient(90deg,var(--accent),var(--gold));
  border:none;
  border-radius:6px;
  color:#000;
  cursor:pointer;
  font-weight:600;
  transition:var(--transition);
}

.submit-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

/* Contact Cards */
.contact-details{
  display:grid;
  gap:2rem;
}

.contact-card{
  background:var(--dark-plum);
  border-radius:12px;
  padding:2rem;
  text-align:center;
  transition:var(--transition);
}

.contact-card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 20px rgba(187,160,242,.2);
}

.contact-icon{
  font-size:2.5rem;
  color:var(--gold);
  margin-bottom:1rem;
}

@media(max-width:768px){
  .contact-container{
    grid-template-columns:1fr;
  }
}
</style>
    <link rel="stylesheet" href="noiraura-luxury.css">
</head>

<body>

<section class="contact-section" id="contact">
<div class="container">
<div class="contact-container">

<!-- FORM -->
<div class="contact-form">
<h2>Get In Touch</h2>

<form id="contact-form">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<div class="form-group">
<label>Full Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Subject</label>
<select name="subject" required>
<option value="" disabled selected>Select subject</option>
<option>General Message</option>
<option>Tracking Issue</option>
<option>Collaboration</option>
<option>Product Support</option>
</select>
</div>

<div class="form-group">
<label>Message</label>
<textarea name="message" rows="5" required></textarea>
</div>

<button class="submit-btn" id="submitBtn">Send Message</button>
</form>
</div>

<!-- DETAILS -->
<div class="contact-details">

<div class="contact-card">
<div class="contact-icon"><i class="fas fa-envelope"></i></div>
<h3>Email</h3>
<p>support@noiraura.com</p>
</div>

<div class="contact-card">
<div class="contact-icon"><i class="fas fa-phone"></i></div>
<h3>Phone</h3>
<p>+92 300 1234567</p>
</div>

<div class="contact-card">
<div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
<h3>Address</h3>
<p>Lahore, Pakistan</p>
</div>

</div>

</div>
</div>
</section>

<script>
document.getElementById("contact-form").addEventListener("submit",function(e){
  e.preventDefault();

  const btn=document.getElementById("submitBtn");
  btn.innerText="Sending...";
  btn.disabled=true;

  fetch("https://formsubmit.co/ajax/eshaldeveloper3@gmail.com",{
    method:"POST",
    body:new FormData(this)
  })
  .then(res=>res.json())
  .then(()=>{
    btn.innerText="Message Sent ✅";
    this.reset();
    setTimeout(()=>{
      btn.innerText="Send Message";
      btn.disabled=false;
    },3000);
  })
  .catch(()=>{
    alert("Message not sent");
    btn.disabled=false;
  });
});
</script>

    <script src="noiraura-products.js"></script>
    <script src="noiraura-luxury.js"></script>
</body>
</html>
